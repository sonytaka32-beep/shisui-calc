name: Build APK — Shisui Calc

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4

      - name: Setup Node.js 20 (via nvm)
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm install 20
          nvm use 20
          node --version
          npm --version

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
          packages: platform-tools cmdline-tools;latest platforms;android-34 build-tools;34.0.0

      - name: Install Cordova
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use 20
          npm install -g cordova@11.0.0

      - name: Build APK
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use 20
          cordova create app com.sonytaka32.shisuicalc "Shisui Calc"
          cd app
          cordova platform add android@11.0.0
          cp -r ../index.html ../css ../js www/
          cp ../config.xml .
          cordova build android

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: shisui-calc-debug-apk
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk