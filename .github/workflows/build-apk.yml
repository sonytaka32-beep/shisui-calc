name: Build APK — Shisui Calc

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
          packages: platform-tools cmdline-tools;latest platforms;android-34 build-tools;34.0.0

      - name: Install Cordova
        run: npm install -g cordova@11.0.0

      - name: Build APK
        run: |
          cordova create app com.sonytaka32.shisuicalc "Shisui Calc"
          cd app
          cordova platform add android@11.0.0
          cp -r ../index.html ../css ../js www/
          cp ../config.xml .
          cordova build android

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: shisui-calc-debug-apk
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk