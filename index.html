<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shisui Calc — Mangekyou Uchiha</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Mangekyou Shisui (hanya CSS, tidak perlu gambar eksternal) -->
  <div class="eye" id="eye">
    <div class="pupil"></div>
    <div class="tomoe t1"></div>
    <div class="tomoe t2"></div>
    <div class="tomoe t3"></div>
    <div class="eye-label">SHISUI UCHIHA</div>
  </div>

  <div class="susanoo-glow"></div>

  <div class="calc" id="calc">
    <div class="display" id="display">0</div>
    <div class="keys">
      <button class="ac" data-ac>AC</button>
      <button class="del" data-del>⌫</button>
      <button class="pct" data-percent>%</button>
      <button class="op" data-op>÷</button>

      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button class="op" data-op>×</button>

      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button class="op" data-op>−</button>

      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button class="op" data-op>+</button>

      <button class="zero">0</button>
      <button>.</button>
      <button class="eq" data-eq>=</button>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
