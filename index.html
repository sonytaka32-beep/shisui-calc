<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shisui Calc — Mangekyou Uchiha</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Mangekyou Shisui (hanya CSS, tidak perlu gambar eksternal) -->
  <div class="eye" id="eye">
    <div class="pupil"></div>
    <div class="tomoe t1"></div>
    <div class="tomoe t2"></div>
    <div class="tomoe t3"></div>
    <div class="eye-label">SHISUI UCHIHA</div>
  </div>

  <div class="susanoo-glow"></div>

  <!-- Uchiha Clan Symbol (Uchiwa Fan) -->
  <div class="uchiwa-symbol" aria-hidden="true">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Fan shape -->
      <path d="M50 8 C50 8 12 35 12 50 C12 65 28 78 50 90 C72 78 88 65 88 50 C88 35 50 8 50 8 Z" stroke="#8b0000" stroke-width="3" stroke-linejoin="round" fill="rgba(139,0,0,0.1)"/>
      <!-- Inner fan lines -->
      <path d="M50 90 Q50 65 50 50 Q50 35 50 20" stroke="#8b0000" stroke-width="2" fill="none" opacity="0.6"/>
      <path d="M30 45 Q40 50 50 50 Q60 50 70 45" stroke="#8b0000" stroke-width="1.5" fill="none" opacity="0.5"/>
      <path d="M25 50 Q40 55 50 50 Q60 55 75 50" stroke="#8b0000" stroke-width="1.5" fill="none" opacity="0.5"/>
      <path d="M22 56 Q40 60 50 50 Q60 60 78 56" stroke="#8b0000" stroke-width="1.5" fill="none" opacity="0.4"/>
      <!-- Center circle -->
      <circle cx="50" cy="50" r="8" fill="#8b0000" opacity="0.8"/>
      <circle cx="50" cy="50" r="4" fill="#00ff88"/>
    </svg>
  </div>

  <div class="calc" id="calc">
    <div class="display" id="display">0</div>
    <div class="keys">
      <button class="ac" data-ac="true">AC</button>
      <button class="del" data-del="true">⌫</button>
      <button class="pct" data-percent="true">%</button>
      <button class="op" data-op="÷">÷</button>

      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button class="op" data-op="×">×</button>

      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button class="op" data-op="−">−</button>

      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button class="op" data-op="+">+</button>

      <button class="zero">0</button>
      <button>.</button>
      <button class="eq" data-eq="true">=</button>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
